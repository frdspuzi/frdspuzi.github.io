<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>frdspuzi</title>
    <!-- GitHub Pages serves static files with no server-side routing, so a direct link/refresh
         on a client-routed path (e.g. a post URL) hits this 404 page instead of index.html.
         Standard SPA-on-GitHub-Pages workaround (rafgraph/spa-github-pages): encode the real
         path into index.html's query string and redirect there; index.html's own matching
         script (see its own comment) decodes it back via history.replaceState before React
         Router ever sees the URL, so the app boots on the correct route with no visible flash
         of a wrong page. pathSegmentsToKeep is 0, not 1 - this is a user/org root page
         (frdspuzi.github.io), not a project page served from a /repo-name/ subpath. -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
