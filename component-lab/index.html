<!doctype html>
<html class="min-height-full" lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint theme sync, ported from header.html's own inline script — runs before React
         even mounts (this is the static index.html shell, not a component), so a returning
         visitor who chose dark mode never sees a light-mode flash before the app catches up. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Other half of 404.html's own redirect trick (see that file's comment) — decodes the
         real path back out of ?p= via history.replaceState before React Router mounts and reads
         window.location, so a direct link/refresh on a client-routed path (e.g. a post URL)
         lands on the correct route with no visible flash of the wrong page. Runs before
         main.tsx's module script (script order in <head> vs the module at the end of <body> is
         still document order), so BrowserRouter never sees the redirected ?p= URL at all. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- Preloaded, not left to the normal CSS-discovers-font flow: site.scss's own @font-face
         rules only get parsed (and the font downloads only start) after the CSS itself has been
         fetched and parsed - a real request-chain delay Lighthouse's network-dependency-tree
         audit flagged. Only the 3 files actually used on this page (400/500/600, latin subset -
         the -ext subsets and weight 700 aren't referenced by any rendered text here, so
         preloading them would just waste bandwidth on files the browser wouldn't otherwise
         fetch). crossorigin is required on font preloads even for same-origin files, per spec -
         fonts are fetched in "anonymous" CORS mode regardless of origin. -->
    <link rel="preload" href="/assets/fonts/fira-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fira-sans-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/fira-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/webp" href="/assets/img/avatar.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mohammad Firdaus bin Mohd Puzi</title>
    <meta
      name="description"
      content="Software engineer's personal portfolio and blog — thoughts, technical explorations, and reflections."
    />
    <!-- Vite substitutes %VITE_COMMIT_SHA% from the env var of the same name at build time (its
         built-in HTML env replacement, no plugin needed) — deploy-pages.yml's own "Verify live
         deployment" step curls the live site for this exact string after publishing, so a
         GitHub Pages CDN edge that reports a successful deploy but never actually serves the new
         build (confirmed to happen at least once — see that step's own comment) fails the job
         loudly instead of silently leaving stale content live. -->
    <meta name="build-commit" content="%VITE_COMMIT_SHA%" />
  </head>
  <body class="theme-surface-page min-height-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
