<!doctype html>
<html class="min-height-full" lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Pre-paint theme sync, ported from header.html's own inline script — runs before React
         even mounts (this is the static index.html shell, not a component), so a returning
         visitor who chose dark mode never sees a light-mode flash before the app catches up. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mohammad Firdaus bin Mohd Puzi</title>
    <meta
      name="description"
      content="Software engineer's personal portfolio and blog — thoughts, technical explorations, and reflections."
    />
  </head>
  <body class="theme-surface-page min-height-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
