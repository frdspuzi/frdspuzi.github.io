          <!-- Vertical stacked list on tablet/desktop (unchanged from before this session's

               shapes. Explicitly NOT a universal redesign — user: "this is strictly only for

               earlier pass wrongly applied the story-tray format at every width. -->
          <div id="medium-posts" class="custom-scrollbar">
            <!-- Two skeleton shapes, CSS-toggled by the same breakpoint the real cards use

            <div id="medium-loading" class="d-flex flex-column medium-skeleton-row" style="gap: 12px;">

              <div class="d-flex flex-row" style="border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 120px;">
                <span class="skeleton" style="width: 160px; flex-shrink: 0; border-radius: 0;"></span>
                <div class="d-flex flex-column flex-auto p-3" style="gap: 8px;">

          <div class="d-flex flex-justify-between flex-items-center mt-3 pt-3 flex-shrink-0 border-top" style="border-color: rgba(149, 157, 165, 0.15) !important;">
            <a href="https://medium.com/@frdspuzi/subscribe" class="btn btn-sm btn-invisible text-gray d-inline-flex flex-items-center" style="gap: 6px;" target="_blank" rel="noopener noreferrer">
              <svg class="octicon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
                <path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2ZM1.5 12.251c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V5.809L8.38 9.397a.75.75 0 0 1-.76 0L1.5 5.809v6.442Zm13-8.181v-.32a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25v.32L8 7.88Z"></path>

              Get updates

            <a href="https://medium.com/@frdspuzi" class="f6 text-gray text-underline" target="_blank" rel="noopener noreferrer">View all &rarr;</a>

      <!-- Right Column: Insights / Trivia -->
      <div class="col-12 col-lg-6 flex-shrink-0 d-flex flex-column">
        {% include learning_board.html %}

    </div>

</details>

<script>
(function () {
  var container = document.getElementById('medium-posts');
  var filtersBar = document.getElementById('medium-filters');
  var activeFilter = 'all';

  // `document.createElement('div'); div.innerHTML = html;` parses the HTML as part of the live
  // document, which means the browser starts fetching every <img> it finds — even though the div
  // is never attached to the page and only .textContent/.querySelector() are ever read from it.
  // With up to 10 full Medium article bodies (not just the one cover image actually shown per
  // card) parsed this way on every page load, that's every inline image in every article,
  // downloaded and immediately discarded — the dominant chunk of a ~5MB+ wasted payload found via
  // PageSpeed Insights. `DOMParser` creates a fully separate, disconnected Document; nothing in
  // it triggers real resource fetches, and .textContent/.querySelectorAll() behave identically.
  function parseHtmlSafely(html) {
    return new DOMParser().parseFromString(html, 'text/html').body;
  }

  function stripHtml(html) {
    return parseHtmlSafely(html).textContent || '';
  }

  function extractSummary(html) {
    var tmp = parseHtmlSafely(html);
    var result = '';

    var paragraphs = tmp.querySelectorAll('p');
    for (var i = 0; i < paragraphs.length; i++) {
      var text = (paragraphs[i].textContent || '').trim();
      var lower = text.toLowerCase();
      if (lower.indexOf('tldr') === 0 || lower.indexOf('tl;dr') === 0 || lower.indexOf('problem statement') === 0) {
        result = text;
        break;
      }
    }

    if (!result) {
      var blockquote = tmp.querySelector('blockquote');
      if (blockquote) {
        var bqText = (blockquote.textContent || '').replace(/\s+/g, ' ').trim();
        if (bqText.length > 20) result = bqText;
      }
    }

    if (!result) {
      for (var i = 0; i < paragraphs.length; i++) {
        var text = (paragraphs[i].textContent || '').replace(/\s+/g, ' ').trim();
        if (text.length > 80) {
          result = text;
          break;
        }
      }
    }

    if (!result) {
      result = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Strip "TLDR;", "TL;DR:", "Problem Statement:" from the very beginning
    result = result.replace(/^(TL;?DR|Problem Statement)[\s;:.,-]+/i, '').trim();

    if (result.length > 140) {
      result = result.slice(0, 140).trim() + '…';
    }
    return result;
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // Checked once, at card-build time — not reactive to a later resize, same "initial-state
  // only" convention already used elsewhere on this site for phone-scoped behavior (e.g. the
  // accordion default-closed correction in _layouts/home.html). Desktop/tablet render the
  // original stacked row-cards; phone (≤767px) renders the smaller horizontal "story tray"
  // cards instead — this is a display-format switch, not a data difference, so both builders
  // below share extractSummary()/shrinkMediumImage() and just lay the same fields out
  // differently. User: "this is strictly only for mobile, i didnt want the arrangement changed
  // for desktop" (2026-08-04) — an earlier pass applied the story-tray format everywhere.
  var isMobile = window.matchMedia('(max-width: 767px)').matches;

  // Medium's own CDN embeds a target width directly in the image URL (miro.medium.com's
  // "resize:fit:NNNN" segment, or the older cdn-images-1.medium.com "/max/NNNN/" style) — the
  // RSS feed's <img> src is sized for full-article display (often 1000px+), but this card only
  // shows it in a `targetWidth`-wide box (160px for the row-card's .medium-image, 120px for the
  // story-card). Requesting a smaller size directly from Medium's CDN avoids downloading pixels
  // that get immediately downscaled and discarded. `targetWidth * 2` = retina headroom;
  // verified directly against the CDN for both sizes (2026-08-04): the same photo was 2.7KB as
  // WebP at resize:fit:320 (2x the row-card's 160px) vs 1.7KB at resize:fit:240 (2x the
  // story-card's 120px) — smaller request for a smaller box, as expected either way.
  //
  // Also requests format:webp — Medium's resize proxy (the same one the size segment above
  // already targets) accepts an extra `/format:webp/` path segment and serves real WebP for
  // both .png and .jpg sources, no extra redirect hop (confirmed directly against the CDN,
  // 2026-08-04): a same-size PNG sample went from 12.7KB to 2.7KB as WebP (-78%), a same-size
  // JPEG sample went from 7.9KB to 3.7KB (-53%). PNG compresses poorly for photographic/
  // screenshot content next to a modern format, so this is most of what PageSpeed's "Improve
  // image delivery" finding was actually about — the size-only optimization above wasn't enough
  // on its own. Falls back to the untouched original URL if neither known Medium CDN pattern
  // matches (both `.replace()` calls are no-ops on a non-matching string), rather than guessing
  // at an unfamiliar URL shape.
  // Self-hosted, not hotlinked from cdn-images-1.medium.com: that CDN sets a third-party cookie
  // (_cfuvid) and no meaningful cache-control headers, both real Lighthouse findings - same fix
  // already applied to YouTube's facade thumbnails above. fetch_medium.js downloads this for
  // every article that has one before medium.json is ever written, so it's already committed by
  // the time a guid shows up in the data - no fallback to the remote URL needed. Still checks
  // item.content for whether an image exists at all (some articles have none), just no longer
  // uses the URL it finds there or resizes on the fly (that now happens once, at download time).
  function findImageUrl(item) {
    var imgRegex = /<img[^>]+src="([^">]+)"/g;
    var match;
    while ((match = imgRegex.exec(item.content)) !== null) {
      if (match[1].indexOf('stat?event') === -1) {
        var id = item.guid.split('/').filter(Boolean).pop();
        return '{{ "/assets/medium-images/" | relative_url }}' + id + '.jpg';
      }
    }
    return null;
  }

  // Original stacked row-card: 160px thumbnail + title/excerpt/date — unchanged from before
  // this session's mobile work, still used on tablet/desktop.
  function buildRowCard(item, category) {
    var excerpt = extractSummary(item.content);
    var imageUrl = findImageUrl(item);

    var imageHtml = '';
    if (imageUrl) {
      imageHtml = '<div class="medium-image flex-shrink-0" style="background-image: url(\'' + imageUrl + '\'); width: 160px; border-right: 1px solid var(--border);"></div>';
    }

    var card = document.createElement('div');
    card.className = 'medium-card-wrapper w-100';
    card.setAttribute('data-category', category);
    card.innerHTML =
      '<a href="' + item.link + '" target="_blank" rel="noopener noreferrer" ' +
        'style="text-decoration:none; display:block;">' +
        '<div class="Box box-shadow-small medium-card overflow-hidden d-flex flex-row text-left" style="min-height: 120px;">' +
          imageHtml +
          '<div class="p-3 d-flex flex-column flex-auto flex-justify-between" style="min-width: 0;">' +
            '<div>' +
              '<h3 class="f4 text-bold lh-condensed mb-1 medium-title text-truncate">' + item.title + '</h3>' +
              '<p class="f6 text-gray medium-excerpt mb-2" style="-webkit-line-clamp: 2;">' + excerpt + '</p>' +
            '</div>' +
            '<div class="d-flex flex-items-center" style="gap:8px;">' +
              '<span class="f6 text-gray medium-date mb-0">' + formatDate(item.pubDate) + '</span>' +
              (category !== 'uncategorized' ? '<span class="medium-tag">' + category + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</a>';
    return card;
  }

  // Smaller "story tray" card: 120x160px, image background + gradient + overlaid title — phone
  // only. No room for a date/excerpt at this size; the excerpt extractSummary() already
  // computes moves to the link's aria-label instead of being dropped outright.
  function buildStoryCard(item, category) {
    var excerpt = extractSummary(item.content);
    var imageUrl = findImageUrl(item);
    var imageStyle = imageUrl ? "background-image: url('" + imageUrl + "');" : '';

    var card = document.createElement('div');
    card.className = 'medium-card-wrapper flex-shrink-0';
    card.setAttribute('data-category', category);
    card.innerHTML =
      '<a href="' + item.link + '" target="_blank" rel="noopener noreferrer" ' +
        'class="medium-story-card" aria-label="' + item.title + ' — ' + excerpt + '" style="' + imageStyle + '">' +
        '<span class="medium-story-overlay"></span>' +
        '<span class="medium-story-overlay-top"></span>' +
        (category !== 'uncategorized' ? '<span class="medium-tag medium-story-tag">' + category + '</span>' : '') +
        '<span class="medium-story-title">' + item.title + '</span>' +
      '</a>';
    return card;
  }

  function buildCard(item, category) {
    return isMobile ? buildStoryCard(item, category) : buildRowCard(item, category);
  }

  function applyFilter(filter) {
    activeFilter = filter;
    var cards = container.querySelectorAll('.medium-card-wrapper');
    cards.forEach(function(card) {
      var cat = card.getAttribute('data-category');
      if (filter === 'all' || cat === filter) {
        card.style.opacity = '0';
        card.style.display = '';
        setTimeout(function(c) { return function() { c.style.opacity = '1'; }; }(card), 10);
      } else {
        card.style.opacity = '0';
        setTimeout(function(c) { return function() { c.style.display = 'none'; }; }(card), 200);
      }
    });

    var btns = filtersBar.querySelectorAll('.medium-filter-btn');
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
    });

    if (typeof window.filterTrivia === 'function') {
      window.filterTrivia(filter);
    }
  }

  function buildFilters(categories) {
    filtersBar.innerHTML = '';
    var allBtn = document.createElement('button');
    allBtn.className = 'medium-filter-btn active';
    allBtn.setAttribute('data-filter', 'all');
    allBtn.textContent = 'All';
    allBtn.addEventListener('click', function() { applyFilter('all'); });
    filtersBar.appendChild(allBtn);

    categories.forEach(function(cat) {
      if (cat === 'uncategorized') return;
      var btn = document.createElement('button');
      btn.className = 'medium-filter-btn';
      btn.setAttribute('data-filter', cat);
      btn.textContent = cat;
      btn.addEventListener('click', function() { applyFilter(cat); });
      filtersBar.appendChild(btn);
    });

    filtersBar.style.display = 'flex';
  }

  // Fetched at build time (.github/scripts/fetch_medium.js -> _data/medium.json) instead of live
  // in the browser on every page view — rss2json's own response time (834ms observed via
  // PageSpeed Insights' network dependency chain) was sitting directly in every visitor's
  // critical path for no reason. Same embedded-data pattern already used by
  // youtube_feed.html/learning_board.html. `items` is `null` if medium.json hasn't been generated
  // yet (workflow hasn't run) — handled the same as a genuinely empty feed, not a separate error
  // state, since there's no network call left to fail differently.
  var items = {{ site.data.medium | jsonify }};

  container.innerHTML = '';
  if (!items || items.length === 0) {
    container.innerHTML = '<p class="text-gray">No articles found.</p>';
  } else {
    var seenCategories = [];

    items.forEach(function (item) {
      var category = (item.categories && item.categories.length > 0)
        ? item.categories[0]
        : 'uncategorized';

      if (seenCategories.indexOf(category) === -1 && category !== 'uncategorized') {
        seenCategories.push(category);
      }

      var card = buildCard(item, category);
      card.style.opacity = '0';
      container.appendChild(card);
      setTimeout(function(c) { return function() { c.style.opacity = '1'; }; }(card), 10);
    });

    if (seenCategories.length > 1) {
      buildFilters(seenCategories);
    }
  }
})();
</script>

<style>
  /* #medium-posts: vertical stacked list (tablet/desktop, unchanged from before this session's
     mobile work) vs. horizontal "story tray" (phone only, ≤767px) — same breakpoint the JS
     above uses to pick buildRowCard() vs buildStoryCard(), so the container's scroll axis
     always matches whichever card shape actually rendered. Moved out of an inline `style`
     attribute into these rules specifically so the mobile override below can win via normal
     media-query cascade instead of needing `!important` to beat inline-style specificity. */
  #medium-posts {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    min-height: 0;
    padding-right: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: var(--fg-faint);
  }
  /* Nested-scroll-region touch properties — iOS Safari's default touch handling for a scroll
     region nested inside the page's own scroll does nothing at all without these set
     explicitly. pan-y here (tablet/desktop, vertical); the mobile override below switches to
     pan-x once the scroll axis flips. */
  .custom-scrollbar {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }

  @media (max-width: 767px) {
    #medium-posts {
      flex-direction: row;
      overflow-y: visible;
      overflow-x: auto;
      min-height: auto;
      padding-right: 0;
      gap: 10px;
    }
    /* Scrollbar hidden entirely on the story tray — matches both the reference "Stories" tray
       this format is based on and Instagram's own convention; snap-scrolling (scroll-snap-type
       below, per-card scroll-snap-align) makes an always-visible scrollbar redundant as a
       position indicator anyway. */
    .custom-scrollbar {
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
  }

  .medium-card-wrapper {
    transition: opacity 0.2s ease;
  }

  /* Tablet/desktop row-card (unchanged) */
  .medium-card {
    border-radius: 8px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    border: 1px solid var(--border);
  }
  .medium-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important;
    transform: translateY(-2px);
  }
  .medium-title {
    color: var(--fg);
  }
  .medium-excerpt {
    color: var(--fg-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .medium-date {
    color: var(--fg-faint);
  }
  .medium-image {
    background-size: cover;
    background-position: center;
  }

  /* Phone-only "story tray" card — background image + bottom gradient + overlaid title.
     Smaller than the reference component this is based on (200x267px) per explicit request
     ("but smaller"): 120x160px, still a 3:4 ratio. No date/excerpt on the card face at this
     size — extractSummary()'s computed excerpt moved to the link's aria-label instead of being
     dropped outright. Only ever rendered by buildStoryCard() on phone, so these rules don't
     need their own media-query gate — the class simply won't exist in the DOM otherwise. */
  .medium-story-card {
    position: relative;
    display: block;
    width: 120px;
    height: 160px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    background-color: var(--surface-alt);
    background-size: cover;
    background-position: center;
    text-decoration: none;
    scroll-snap-align: start;
    transition: transform 0.2s ease;
  }
  .medium-story-card:hover {
    transform: translateY(-2px) scale(1.02);
  }
  .medium-story-overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 65%;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    pointer-events: none;
  }
  /* Bottom overlay alone left the tag's own corner with no scrim at all — readable against a
     dark photo, unreadable against a light one (reported by the user against a screenshot,
     "What is Scrum?"'s pale cover specifically). A top scrim guarantees contrast for the tag
     regardless of what the underlying photo looks like up there, the same way the bottom one
     already does for the title. */
  .medium-story-overlay-top {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 40%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
    pointer-events: none;
  }
  /* Own background, not just the shared .medium-story-overlay below — that overlay's height/
     gradient was tuned for a short, 1-line title, so a long title's top line landed above where
     the overlay was already dark, in its faded-to-transparent region, with little to no scrim
     under it. This element isn't height-constrained (only clamped to a max line count), so its
     own background naturally grows to cover however many lines actually render — contrast is
     guaranteed regardless of title length, not tuned for one case.

     line-clamp raised 3 -> 5 (2026-08-06): 3 lines was cutting off mid-word on realistically-
     long article titles ("Doesnt show full title"). At this font-size/line-height, 5 lines is
     still comfortably within the card's 65%-height bottom overlay zone (.medium-story-overlay,
     104px of the 160px card) — the title's own background (which grows with it) stays within
     that region rather than pushing past the card's own edge. */
  .medium-story-title {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 10px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.35));
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
  /* Deliberately not .medium-tag's own theme-token colors (var(--accent-bg)/var(--accent)) —
     those are tuned to sit on a plain surface background, not an arbitrary photo. A badge
