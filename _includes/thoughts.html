  <summary class="p-4 d-flex flex-justify-between flex-items-center" style="cursor: pointer; user-select: none;">

    <svg class="collapse-arrow text-gray flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="24" height="24" fill="currentColor">
      <path d="M12.78 6.22a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L3.22 7.28a.75.75 0 0 1 1.06-1.06L8 9.94l3.72-3.72a.75.75 0 0 1 1.06 0Z"></path>
    </svg>

  <div class="p-4 text-left accordion-content">

            </div>
          </div>

          <div id="medium-posts" class="d-flex flex-column flex-auto custom-scrollbar" style="gap: 12px; overflow-y: auto; min-height: 0; padding-right: 8px;">
            <!-- Skeleton cards, shaped like .medium-card below (160px image block + title/
                 excerpt/date lines) — replaced entirely (container.innerHTML = '') once the
                 fetch below resolves, whether it succeeds or fails, so no JS toggle logic is
                 needed here unlike the YouTube/Trivia skeletons. See assets/styles.scss's
                 .skeleton comment for the animation choice. -->
            <div id="medium-loading" class="d-flex flex-column" style="gap: 12px;">
              <div class="d-flex flex-row" style="border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 120px;">
                <span class="skeleton" style="width: 160px; flex-shrink: 0; border-radius: 0;"></span>
                <div class="d-flex flex-column flex-auto p-3" style="gap: 8px;">
                  <span class="skeleton" style="width: 90%; height: 18px;"></span>
                  <span class="skeleton" style="width: 60%; height: 14px;"></span>
                  <span class="skeleton" style="width: 40%; height: 12px; margin-top: auto;"></span>
                </div>
              </div>
              <div class="d-flex flex-row" style="border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 120px;">
                <span class="skeleton" style="width: 160px; flex-shrink: 0; border-radius: 0;"></span>
                <div class="d-flex flex-column flex-auto p-3" style="gap: 8px;">
                  <span class="skeleton" style="width: 80%; height: 18px;"></span>
                  <span class="skeleton" style="width: 50%; height: 14px;"></span>
                  <span class="skeleton" style="width: 40%; height: 12px; margin-top: auto;"></span>
                </div>
              </div>
              <div class="d-flex flex-row" style="border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 120px;">
                <span class="skeleton" style="width: 160px; flex-shrink: 0; border-radius: 0;"></span>
                <div class="d-flex flex-column flex-auto p-3" style="gap: 8px;">
                  <span class="skeleton" style="width: 95%; height: 18px;"></span>
                  <span class="skeleton" style="width: 65%; height: 14px;"></span>
                  <span class="skeleton" style="width: 40%; height: 12px; margin-top: auto;"></span>
                </div>
              </div>
            </div>
          </div>
          
          <div class="d-flex flex-justify-between flex-items-center mt-3 pt-3 flex-shrink-0 border-top" style="border-color: rgba(149, 157, 165, 0.15) !important;">
            <a href="https://medium.com/@frdspuzi/subscribe" class="btn btn-sm btn-invisible text-gray d-inline-flex flex-items-center" style="gap: 6px;" target="_blank" rel="noopener noreferrer">
              <svg class="octicon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
                <path d="M1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25v-8.5C0 2.784.784 2 1.75 2ZM1.5 12.251c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V5.809L8.38 9.397a.75.75 0 0 1-.76 0L1.5 5.809v6.442Zm13-8.181v-.32a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25v.32L8 7.88Z"></path>
              </svg>
              Get updates

<script>
(function () {
  var MEDIUM_RSS = 'https://medium.com/feed/@frdspuzi';
  var API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(MEDIUM_RSS);
  var container = document.getElementById('medium-posts');
  var filtersBar = document.getElementById('medium-filters');
  var activeFilter = 'all';

  function stripHtml(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
  }

  function extractSummary(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var result = '';

    var paragraphs = tmp.querySelectorAll('p');
    for (var i = 0; i < paragraphs.length; i++) {
      var text = (paragraphs[i].textContent || '').trim();
      var lower = text.toLowerCase();
      if (lower.indexOf('tldr') === 0 || lower.indexOf('tl;dr') === 0 || lower.indexOf('problem statement') === 0) {
        result = text;
        break;
      }
    }

    if (!result) {
      var blockquote = tmp.querySelector('blockquote');
      if (blockquote) {
        var bqText = (blockquote.textContent || '').replace(/\s+/g, ' ').trim();
        if (bqText.length > 20) result = bqText;
      }
    }

    if (!result) {
      for (var i = 0; i < paragraphs.length; i++) {
        var text = (paragraphs[i].textContent || '').replace(/\s+/g, ' ').trim();
        if (text.length > 80) {
          result = text;
          break;
        }
      }
    }

    if (!result) {
      result = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Strip "TLDR;", "TL;DR:", "Problem Statement:" from the very beginning
    result = result.replace(/^(TL;?DR|Problem Statement)[\s;:.,-]+/i, '').trim();

    if (result.length > 140) {
      result = result.slice(0, 140).trim() + '…';
    }
    return result;
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // Medium's own CDN embeds a target width directly in the image URL (miro.medium.com's
  // "resize:fit:NNNN" segment, or the older cdn-images-1.medium.com "/max/NNNN/" style) — the
  // RSS feed's <img> src is sized for full-article display (often 1000px+), but this card only
  // shows it in a 160px-wide box (.medium-image). Requesting a smaller size directly from
  // Medium's CDN avoids downloading pixels that get immediately downscaled and discarded —
  // verified against a real feed image: the same photo was 63KB at max/1024 vs 12.7KB at
  // max/320, an 80% cut, for identical on-screen output. 320 = 2x the 160px box, generous
  // headroom for retina displays. Falls back to the untouched original URL if neither known
  // Medium CDN pattern matches (both `.replace()` calls are no-ops on a non-matching string),
  // rather than guessing at an unfamiliar URL shape.
  function shrinkMediumImage(url) {
    return url
      .replace(/resize:fit:\d+/, 'resize:fit:320')
      .replace(/\/max\/\d+\//, '/max/320/');
  }

  function buildCard(item, category) {
    var excerpt = extractSummary(item.content);

    var imageUrl = null;
    var imgRegex = /<img[^>]+src="([^">]+)"/g;
    var match;
    while ((match = imgRegex.exec(item.content)) !== null) {
      if (match[1].indexOf('stat?event') === -1) {
        imageUrl = shrinkMediumImage(match[1]);
        break;
      }
    }

    var imageHtml = '';
    if (imageUrl) {
      imageHtml = '<div class="medium-image flex-shrink-0" style="background-image: url(\'' + imageUrl + '\'); width: 160px; border-right: 1px solid var(--border);"></div>';
    }

    var card = document.createElement('div');
    card.className = 'medium-card-wrapper w-100';
    card.setAttribute('data-category', category);
    card.innerHTML =
      '<a href="' + item.link + '" target="_blank" rel="noopener noreferrer" ' +
        'style="text-decoration:none; display:block;">' +
        '<div class="Box box-shadow-small medium-card overflow-hidden d-flex flex-row text-left" style="min-height: 120px;">' +
          imageHtml +
          '<div class="p-3 d-flex flex-column flex-auto flex-justify-between" style="min-width: 0;">' +
            '<div>' +
              '<h3 class="f4 text-bold lh-condensed mb-1 medium-title text-truncate">' + item.title + '</h3>' +
              '<p class="f6 text-gray medium-excerpt mb-2" style="-webkit-line-clamp: 2;">' + excerpt + '</p>' +
            '</div>' +
            '<div class="d-flex flex-items-center" style="gap:8px;">' +
              '<span class="f6 text-gray medium-date mb-0">' + formatDate(item.pubDate) + '</span>' +
              (category !== 'uncategorized' ? '<span class="medium-tag">' + category + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</a>';
    return card;
  }

  function applyFilter(filter) {
    activeFilter = filter;
    var cards = container.querySelectorAll('.medium-card-wrapper');
    cards.forEach(function(card) {
      var cat = card.getAttribute('data-category');
      if (filter === 'all' || cat === filter) {
        card.style.opacity = '0';
        card.style.display = '';
        setTimeout(function(c) { return function() { c.style.opacity = '1'; }; }(card), 10);
      } else {
        card.style.opacity = '0';
        setTimeout(function(c) { return function() { c.style.display = 'none'; }; }(card), 200);
      }
    });

    var btns = filtersBar.querySelectorAll('.medium-filter-btn');
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
    });

    if (typeof window.filterTrivia === 'function') {
      window.filterTrivia(filter);
    }
  }

  function buildFilters(categories) {
    filtersBar.innerHTML = '';
    var allBtn = document.createElement('button');
    allBtn.className = 'medium-filter-btn active';
    allBtn.setAttribute('data-filter', 'all');
    allBtn.textContent = 'All';
    allBtn.addEventListener('click', function() { applyFilter('all'); });
    filtersBar.appendChild(allBtn);

    categories.forEach(function(cat) {
      if (cat === 'uncategorized') return;
      var btn = document.createElement('button');
      btn.className = 'medium-filter-btn';
      btn.setAttribute('data-filter', cat);
      btn.textContent = cat;
      btn.addEventListener('click', function() { applyFilter(cat); });
      filtersBar.appendChild(btn);
    });

    filtersBar.style.display = 'flex';
  }

  fetch(API_URL)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      container.innerHTML = '';
      if (!data.items || data.items.length === 0) {
        container.innerHTML = '<p class="text-gray">No articles found.</p>';
        return;
      }

      var seenCategories = [];
      var items = data.items.slice(0, 10); /* Fetch more items since the container is now scrollable */

      items.forEach(function (item) {
        var category = (item.categories && item.categories.length > 0)
          ? item.categories[0]
          : 'uncategorized';

        if (seenCategories.indexOf(category) === -1 && category !== 'uncategorized') {
          seenCategories.push(category);
        }

        var card = buildCard(item, category);
        card.style.opacity = '0';
        container.appendChild(card);
        setTimeout(function(c) { return function() { c.style.opacity = '1'; }; }(card), 10);
      });

      if (seenCategories.length > 1) {
        buildFilters(seenCategories);
      }
    })
    .catch(function () {
      container.innerHTML =
        '<p class="text-gray">Could not load articles. ' +
        '<a href="https://medium.com/@frdspuzi" target="_blank" rel="noopener noreferrer">Read on Medium &rarr;</a></p>';
    });
})();
</script>

<style>
  /* Scrollable Container Styling */
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: var(--fg-faint);
  }
  /* #medium-posts sits inside .right-column-container (a fixed-height, overflow:hidden box on
     mobile — see below), so this is a scroll region nested inside the page's own scroll — two
     things it needs to actually feel scrollable with touch, not just technically have
     overflow-y: auto set:
     - -webkit-overflow-scrolling: touch — iOS Safari's default scrolling for a *nested* overflow
       region is the janky, non-momentum kind unless this is set explicitly; without it, a swipe
       here can feel like it's not responding at all rather than just scrolling abruptly.
     - overscroll-behavior: contain — stops the swipe from "leaking" into the outer page scroll
       once the list hits its own top/bottom edge, which otherwise reads as the list capturing the
       gesture inconsistently (scrolls the list sometimes, scrolls the whole page other times).
     - touch-action: pan-y — the actual fix for "swipe does nothing at all" (as opposed to
       "scrolls but feels janky", which the two properties above address). #medium-posts is itself
       `display:flex` AND every direct child is a full-width, full-height `<a>` card — without an
       explicit `touch-action`, some mobile browsers don't reliably recognize a vertical swipe that
       starts on a flex-laid-out anchor as "this element's own scroll gesture" and the touch is
       dropped instead of falling through to native scrolling. Declaring `pan-y` up front removes
       the ambiguity: this element scrolls vertically on touch, full stop. */
  .custom-scrollbar {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }

  /* The actual root cause of "swipe does nothing at all": #medium-posts is flex: 1 1 auto inside
     .right-column-content, but a flex item's automatic minimum size defaults to its content's
     natural (unclamped) height, not 0 — #medium-posts already overrides this on itself, but
     .right-column-content (one level up) didn't, so IT was growing to fit every article card
     regardless of the 450px/648px cap below, dragging #medium-posts's height along with it. The
     result: .right-column-container's own `overflow: hidden` was doing 100% of the visual
     clipping (which is why a card looked cut off), while #medium-posts — the element with
     `overflow-y: auto` — never actually had content taller than itself to scroll. Capping this
     here is what actually makes #medium-posts a bounded, genuinely-overflowing scroll container. */
  .right-column-content {
    min-height: 0;
  }

  @media (max-width: 1011px) {
    .right-column-container {
      height: 450px;
      overflow: hidden;
    }
  }

  @media (min-width: 1012px) {
    .right-column-container {
      height: 648px;
      position: relative;
    }
    .right-column-content {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
    }
  }

  .medium-card-wrapper {
    transition: opacity 0.2s ease;
  }

  .medium-card-wrapper {
    transition: opacity 0.2s ease;
  }

  .medium-card {
    border-radius: 8px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    border: 1px solid var(--border);
  }
  .medium-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important;
    transform: translateY(-2px);
  }
  .medium-title {
    color: var(--fg);
  }
  .medium-excerpt {
    color: var(--fg-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .medium-date {
    color: var(--fg-faint);
  }
  .medium-image {
    background-size: cover;
    background-position: center;
  }
  .medium-read-more {
    color: var(--accent);
    font-weight: 500;
  }
  .medium-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    background-color: var(--accent-bg);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #medium-filters {
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .medium-filter-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .medium-filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .medium-filter-btn.active {
    background: var(--accent-solid);
    border-color: var(--accent-solid);
    color: white;
  }

</style>
