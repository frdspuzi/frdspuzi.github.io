<!-- `?v=` cache-busts on demand — same fix and same reasoning as styles.css in header.html:
     without it, a visitor's browser can keep serving a stale cached copy of one of these
     indefinitely after a JS change ships, since the URL itself never changes otherwise. Uses
     `site.asset_version` (see _config.yml) instead of the build timestamp, so unrelated deploys
     (bot commits, content-only changes) don't force a re-fetch of these on every visit — bump
     `asset_version` by hand when one of these 4 files (or styles.css) actually changes. -->
<script src="{{ '/assets/js/accordion.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
<script src="{{ '/assets/js/quote-typing.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
<script src="{{ '/assets/js/aurora-reveal.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
<script src="{{ '/assets/js/accordion-grouping.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
</body>
</html>
