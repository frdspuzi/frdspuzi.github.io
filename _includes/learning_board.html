{% if site.data.learning and site.data.learning.learnings %}
<div class="learning-board box-shadow-large mb-4 mb-md-0 p-4 p-md-5 border rounded-2 flex-auto d-flex flex-column theme-surface theme-border position-relative overflow-hidden">
  
  <!-- Subtle decorative background element -->
  <div class="position-absolute" style="top: -20px; right: -20px; opacity: 0.05; font-size: 150px; line-height: 1; pointer-events: none; user-select: none;">
    🧠
  </div>

  <div class="position-relative z-1 text-center text-md-left d-flex flex-column h-100">
    <div class="flex-shrink-0 d-flex flex-column flex-md-row flex-justify-between flex-items-md-start mb-4" style="gap: 16px;">
      <div>
        <h3 class="f5 text-uppercase text-gray-light mb-1 tracking-wide" style="letter-spacing: 2px;">AI Insight of the Day</h3>
        <p id="trivia-subtitle" class="f6 text-gray mb-0">Test your knowledge with a daily trivia question generated by AI from my articles!</p>
      </div>
    </div>

    <!-- Pagination — its own centered row, not squeezed against the title's row (which used to
         also hold the now-removed </> arrow buttons, where right-alignment made sense as their
         neighbor; centering reads better now that this is just a position indicator on its own). -->
    <div id="trivia-helpers" class="d-flex flex-justify-center mb-3">
      <div id="trivia-dots" class="d-flex flex-items-center" style="gap: 6px;"></div>
    </div>

    <!-- Swipe/drag on the whole card moves this track — see the script's own comment on
         moveSwipe()/endSwipe() for the full mechanism (ported from youtube_feed.html's
         #yt-carousel-viewport/#yt-carousel-track). #trivia-carousel-viewport clips to the
         current slide's own height (synced by a ResizeObserver further down) since the
         track's 3 children have different natural heights — previews are simpler, and the
         real card itself grows a lot once a question is answered.

         Each slide gets 10px of horizontal padding (box-sizing: border-box, already global via
         Primer's reset, so this insets the *content* without changing the slide's own 100%
         outer width — the swipe/clamp math in the script depends on that width staying exactly
         one viewport-width). Without it, mid-drag showed the current and next/prev slides'
         content flush against each other with zero separation (reported by the user against a
         screenshot) — unlike the YT carousel's slides, which already have their own .Box
         border/shadow/padding giving them a natural seam, trivia's slides have no card chrome of
         their own (the whole .learning-board is one shared card), so they needed an explicit
         gutter instead of already having one for free. -->
    <div id="trivia-carousel-viewport" tabindex="0" aria-label="Trivia question card — swipe or use arrow keys to browse questions" style="overflow: hidden; position: relative; cursor: grab; user-select: none;">
      <div id="trivia-carousel-track" style="display: flex; transform: translateX(-100%);">
        <div id="trivia-slide-prev" class="trivia-slide-preview" style="flex: 0 0 100%; padding: 0 10px;"></div>

    <div id="trivia-container" class="d-flex flex-column" style="flex: 0 0 100%; min-height: 0; padding: 0 10px;">

      <!-- Skeleton placeholder, shaped like the real content below (2-line question, source
           line, 3 option bars) — shown until loadQuestion()'s first run swaps it out for
           #trivia-content. See assets/styles.scss's .skeleton comment for the animation choice. -->
      <!-- Plain inline flex styles, not Primer's d-flex/flex-column classes: Primer declares
           `.d-flex { display: flex !important; }`, and a stylesheet !important beats a plain
           inline style.display set later from JS — loadQuestion()'s `skeletonEl.style.display =
           'none'` was silently losing to it, leaving the skeleton visibly stuck on top of the
           real content underneath. A same-origin (inline) style has no such conflict. -->
      <div id="trivia-skeleton" style="display: flex; flex-direction: column; gap: 12px;">
        <span class="skeleton" style="width: 100%; height: 22px;"></span>
        <span class="skeleton" style="width: 70%; height: 22px;"></span>
        <span class="skeleton" style="width: 160px; height: 16px; margin-top: 4px;"></span>
        <span class="skeleton" style="width: 100%; height: 40px; margin-top: 8px;"></span>
        <span class="skeleton" style="width: 100%; height: 40px;"></span>
        <span class="skeleton" style="width: 100%; height: 40px;"></span>
      </div>

      <!-- Content Area -->
      <!-- pr-3/pb-2/custom-scrollbar (scrollbar-gutter breathing room) removed — leftover from
           before this became a carousel slide, when #trivia-container could be height-bounded
           and this content might genuinely overflow/scroll within it. The carousel's own
           ResizeObserver now sizes the viewport to match this content's natural height instead
           (see the script further down), so nothing here ever actually scrolls anymore; the
           padding was just adding uneven right/bottom inset with nothing to justify it —
           reported by the user as the card "doesn't seem to have even paddings." -->
      <div id="trivia-content" class="flex-auto" style="min-height: 0; display: none;">
        <!-- Question -->
        <h2 id="trivia-question" class="f4 mb-3" style="line-height: 1.4; font-weight: 500; color: var(--fg);">
          Loading question...
        </h2>

        <!-- Article source attribution / hint -->
        <p id="trivia-source" class="f6 mb-4" style="color: var(--fg-muted);">
          <span>Not sure? Read: </span><a id="trivia-source-link" href="#" class="text-underline" style="color: var(--fg-muted);" target="_blank" rel="noopener noreferrer"></a>
        </p>

        <!-- Options -->
        <div id="trivia-options" class="d-flex flex-column" style="gap: 12px; margin-bottom: 16px;">
          <!-- Buttons injected by JS -->
        </div>

        <!-- Reveal Area (Hidden by default) -->
        <div id="trivia-reveal" style="display: none;">
          <div class="flash-success p-3 rounded-2 mb-4" style="background-color: var(--success-bg); border: 1px solid var(--success-fg);">
            <p id="learning-text" class="f4 text-italic mb-0" style="line-height: 1.4; color: var(--success-fg);">
              <!-- Learning text here -->
            </p>
          </div>

          <div class="d-flex flex-column border-top pt-4 theme-border" style="width: 100%;">
            <div class="f6 text-gray mb-3 text-left">
              From the article: <strong id="learning-title" class="f5 d-block mt-1 theme-fg"></strong>
            </div>
            <div class="d-flex flex-column flex-sm-row flex-justify-between" style="gap: 12px; width: 100%;">
              <a id="learning-link" href="#" class="btn flex-1 text-center" target="_blank" rel="noopener noreferrer">
                Read Article
              </a>
              <button id="btn-next-question" type="button" class="btn btn-blue flex-1 text-center">
                Next Question &rarr;
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

        <div id="trivia-slide-next" class="trivia-slide-preview" style="flex: 0 0 100%; padding: 0 10px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // We filter to only items with a question to avoid breaking the UI for older cached data
    const rawLearnings = {{ site.data.learning.learnings | jsonify }};
    const allLearnings = rawLearnings ? rawLearnings.filter(l => l.question && l.options) : [];
    let currentLearnings = [...allLearnings];
    
    const skeletonEl = document.getElementById('trivia-skeleton');
    const contentEl = document.getElementById('trivia-content');

    if (!allLearnings || allLearnings.length === 0) {
      document.getElementById('trivia-question').innerText = "Oops! My AI is currently studying for the next quiz. Check back tomorrow!";
      document.getElementById('trivia-options').style.display = 'none';
      skeletonEl.style.display = 'none';
      contentEl.style.display = '';
      return;
    }

    const questionEl = document.getElementById('trivia-question');
    const optionsEl = document.getElementById('trivia-options');
    const revealEl = document.getElementById('trivia-reveal');
    const learningTextEl = document.getElementById('learning-text');
    const titleEl = document.getElementById('learning-title');
    const linkEl = document.getElementById('learning-link');
    const nextBtn = document.getElementById('btn-next-question');
    const helpersContainer = document.getElementById('trivia-helpers');

    // Carousel elements — ported from youtube_feed.html's #yt-carousel-viewport/#yt-carousel-track.
    const viewportEl = document.getElementById('trivia-carousel-viewport');
    const trackEl = document.getElementById('trivia-carousel-track');
    const prevSlideEl = document.getElementById('trivia-slide-prev');
    const nextSlideEl = document.getElementById('trivia-slide-next');
    const triviaContainerEl = document.getElementById('trivia-container');

    let currentItem = null;
    let currentIndex = 0;

    // Keeps the flex-row track from stretching to its tallest child by default — previews are
    // simpler/shorter than the real card, and the real card itself grows a lot once a question
    // is answered (the reveal panel). Same mechanism as youtube_feed.html's own ResizeObserver.
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        viewportEl.style.height = triviaContainerEl.offsetHeight + 'px';
      }).observe(triviaContainerEl);
    }

    window.filterTrivia = function(category) {
      if (!allLearnings || allLearnings.length === 0) return;
      
      const subtitleEl = document.getElementById('trivia-subtitle');
      if (category === 'all') {
        currentLearnings = [...allLearnings];
        if (subtitleEl) subtitleEl.innerHTML = 'Test your knowledge with a daily trivia question generated by AI from my articles!';
      } else {
        currentLearnings = allLearnings.filter(l => l.category && l.category.toLowerCase() === category.toLowerCase());
        if (currentLearnings.length === 0) {
          // Fallback to all if no trivia exists for this category
          currentLearnings = [...allLearnings];
          if (subtitleEl) subtitleEl.innerHTML = 'Test your knowledge with a daily trivia question generated by AI from my articles!';
        } else {
          if (subtitleEl) subtitleEl.innerHTML = 'Test your knowledge with a daily trivia question generated by AI from my <strong>' + category + '</strong> articles!';
        }
      }
      
      currentIndex = 0;
      loadQuestion(currentIndex);
    };

    function updatePagination() {
      const dotsContainer = document.getElementById('trivia-dots');
      dotsContainer.innerHTML = '';
      currentLearnings.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'trivia-dot' + (idx === currentIndex ? ' active' : '');
        dotsContainer.appendChild(dot);
      });
    }

    function loadQuestion(index) {
      if (currentLearnings.length === 0) return;
      // Wraparound instead of a bounds no-op — matches the "Next Question →" button's own
      // existing wraparound below, and lets a committed swipe at either boundary always land
      // somewhere instead of silently doing nothing.
      if (index >= currentLearnings.length) index = 0;
      if (index < 0) index = currentLearnings.length - 1;

      currentIndex = index;
      currentItem = currentLearnings[currentIndex];

      revealEl.style.display = 'none';
      optionsEl.innerHTML = '';

      questionEl.innerText = currentItem.question;

      const sourceLinkEl = document.getElementById('trivia-source-link');
      sourceLinkEl.innerText = currentItem.articleTitle;
      sourceLinkEl.href = currentItem.articleUrl;

      currentItem.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn text-left p-2 text-normal f6 trivia-btn';
        btn.style.width = '100%';
        btn.style.whiteSpace = 'normal';
        btn.innerText = optText;

        btn.onclick = () => handleAnswer(index, btn);
        optionsEl.appendChild(btn);
      });

      updatePagination();

      // Idempotent, same as youtube_feed.html's equivalent swap — harmless to set on every
      // question change, not just the first.
      skeletonEl.style.display = 'none';
      contentEl.style.display = '';

      updatePreviewSlides();
    }

    // Builds the peek content for a neighboring (not "current") slide — full structural parity
    // with the real card (question + source line + every option), not a simplified thumbnail-
    // style summary. Options are non-interactive <div>s styled identically to the real
    // .trivia-btn buttons (same classes) but with pointer-events:none and no onclick — the real,
    // answerable card only ever exists once, for whichever slide is "current," via loadQuestion()'s
    // own element mutation above. Always shows the fresh/unanswered shape, matching how
    // loadQuestion() itself resets any question's reveal state when it becomes current.
    function buildPreviewSlide(item) {
      var optionsHtml = item.options
        .map(function (opt) {
          return (
            '<div class="btn text-left p-2 text-normal f6 trivia-btn" style="width: 100%; white-space: normal; pointer-events: none;">' +
              opt +
            '</div>'
          );
        })
        .join('');
      return (
        '<div class="d-flex flex-column" style="height: 100%; box-sizing: border-box;">' +
          '<h2 class="f4 mb-3" style="line-height: 1.4; font-weight: 500; color: var(--fg);">' + item.question + '</h2>' +
          '<p class="f6 mb-4" style="color: var(--fg-muted);">' +
            '<span>Not sure? Read: </span><span class="text-underline">' + item.articleTitle + '</span>' +
          '</p>' +
          '<div class="d-flex flex-column" style="gap: 12px; margin-bottom: 16px;">' + optionsHtml + '</div>' +
        '</div>'
      );
    }

    // Called every time loadQuestion() runs so the previews always match currentIndex — same
    // wraparound math loadQuestion() itself uses, against currentLearnings (the filtered array),
    // not allLearnings, so a category filter's own shorter list previews correctly too.
    function updatePreviewSlides() {
      if (currentLearnings.length === 0) return;
      var prevIndex = (currentIndex - 1 + currentLearnings.length) % currentLearnings.length;
      var nextIndex = (currentIndex + 1) % currentLearnings.length;
      prevSlideEl.innerHTML = buildPreviewSlide(currentLearnings[prevIndex]);
      nextSlideEl.innerHTML = buildPreviewSlide(currentLearnings[nextIndex]);
    }

    function handleAnswer(selectedIndex, clickedBtn) {
      const buttons = optionsEl.querySelectorAll('button');
      buttons.forEach((b, i) => {
        b.disabled = true;
        if (i === currentItem.correctIndex) {
          b.classList.add('trivia-correct');
        }
      });

      if (clickedBtn && selectedIndex !== currentItem.correctIndex) {
        clickedBtn.classList.add('trivia-wrong', 'shake-anim');
      }

      learningTextEl.innerText = currentItem.learning;
      titleEl.innerText = currentItem.articleTitle;
      linkEl.href = currentItem.articleUrl;
      revealEl.style.display = 'block';
    }

    // Swipe/drag to browse Prev/Next, replacing the old </>  buttons — ported directly from
    // youtube_feed.html's #yt-carousel-viewport wiring (same thresholds, same mouse+touch
    // handling, same axis-lock reasoning). Two differences from that file, both deliberate:
    // no dragDistance-vs-click suppression is needed here (trivia's option buttons/links are
    // small, ordinary targets — after a real drag the pointer is no longer over the same small
    // button at release, unlike YT's viewport-sized facade, so no spurious click can fire); and
    // this card isn't inside an animated <details>, so there's no accordion height to re-sync,
    // only the viewport's own height (handled by the ResizeObserver above).
    var SWIPE_COMMIT_THRESHOLD = 50;
    var SWIPE_AXIS_LOCK_THRESHOLD = 10;
    var SWIPE_SETTLE_MS = 250;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var swiping = false;
    var swipeAxis = null; // null (undetermined) | 'horizontal' | 'vertical'
    var swipeStartX = 0;
    var swipeStartY = 0;
    var swipeLastX = 0;
    var swipeLastY = 0;

    function startSwipe(x, y) {
      swiping = true;
      swipeAxis = null;
      swipeStartX = x;
      swipeStartY = y;
      swipeLastX = x;
      swipeLastY = y;
      viewportEl.style.cursor = 'grabbing';
    }

    function moveSwipe(x, y) {
      if (!swiping) return;
      swipeLastX = x;
      swipeLastY = y;

      if (swipeAxis === null) {
        var totalX = Math.abs(swipeLastX - swipeStartX);
        var totalY = Math.abs(swipeLastY - swipeStartY);
        if (totalX + totalY > SWIPE_AXIS_LOCK_THRESHOLD) {
          swipeAxis = totalX > totalY ? 'horizontal' : 'vertical';
        }
      }
      if (swipeAxis === 'vertical') return; // handed off to native scroll — see endSwipe() too

      if (!reduceMotion) {
        // Same clamp derivation as youtube_feed.html: translateX(-100%) on a flex row refers to
        // the track's own rendered width, which equals one slide's width (each of the 3 children
        // is flex: 0 0 100%) — so the viewport's own width is that one-slide-width, and clamping
        // the raw px delta to ±that value stops the drag right at fully-revealing the prev/next
        // slide, never past it into empty space.
        var dx = swipeLastX - swipeStartX;
        var maxDx = viewportEl.getBoundingClientRect().width;
        dx = Math.max(-maxDx, Math.min(maxDx, dx));
        trackEl.style.transform = 'translateX(calc(-100% + ' + dx + 'px))';
      }
    }

    function endSwipe() {
      if (!swiping) return;
      swiping = false;
      viewportEl.style.cursor = 'grab';
      if (swipeAxis === 'vertical') return;
      var netX = swipeLastX - swipeStartX;
      var committed = Math.abs(netX) > SWIPE_COMMIT_THRESHOLD;
      var nextIndex = netX > 0 ? currentIndex - 1 : currentIndex + 1;

      if (!committed) {
        if (!reduceMotion) {
          trackEl.style.transition = 'transform ' + SWIPE_SETTLE_MS + 'ms ease-out';
          trackEl.style.transform = 'translateX(-100%)';
          setTimeout(function () {
            trackEl.style.transition = '';
          }, SWIPE_SETTLE_MS);
        }
        return;
      }

      if (reduceMotion) {
        loadQuestion(nextIndex);
        return;
      }

      // Dragged right (netX > 0) reveals the prev slide at track position 0 (0%); dragged left
      // reveals the next slide at track position 2 (-200%).
      var targetPercent = netX > 0 ? '0%' : '-200%';
      trackEl.style.transition = 'transform ' + SWIPE_SETTLE_MS + 'ms ease-out';
      trackEl.style.transform = 'translateX(' + targetPercent + ')';
      setTimeout(function () {
        loadQuestion(nextIndex); // also rebuilds both preview slides for the new neighbors
        // Instant reset, no transition — the freshly-populated current slide (now the middle
        // track position again) should appear centered immediately, not slide in from off-screen.
        trackEl.style.transition = 'none';
        trackEl.style.transform = 'translateX(-100%)';
        // Forces the instant reset above to actually apply before the transition is re-added
        // below — without this, the browser can coalesce both style changes into the same frame
        // and animate the reset too, undoing the "instant" part entirely.
        void trackEl.offsetWidth;
        trackEl.style.transition = '';
      }, SWIPE_SETTLE_MS);
    }

    // user-select: none on the viewport (see the inline style above) makes a click-drag over the
    // question text unambiguous for mouse — always a swipe attempt, never a text selection.
    viewportEl.addEventListener('mousedown', function (e) {
      startSwipe(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function (e) {
      moveSwipe(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', endSwipe);

    viewportEl.addEventListener(
      'touchstart',
      function (e) {
        if (e.touches.length !== 1) return;
        startSwipe(e.touches[0].clientX, e.touches[0].clientY);
      },
      { passive: true }
    );
    viewportEl.addEventListener(
      'touchmove',
      function (e) {
        if (!swiping || e.touches.length !== 1) return;
        moveSwipe(e.touches[0].clientX, e.touches[0].clientY);
        // Only claim the gesture (block native scroll) once it's actually locked horizontal — an
        // undetermined or vertical-locked gesture must NOT preventDefault, or the page could
        // never be scrolled by touching down on this card at all.
        if (swipeAxis === 'horizontal') e.preventDefault();
      },
      { passive: false }
    );
    viewportEl.addEventListener('touchend', endSwipe);
    viewportEl.addEventListener('touchcancel', endSwipe);

    // Keyboard replacement for the removed </> buttons — viewportEl has no native focusable
    // element the way youtube_feed.html's facade button did, so it's made focusable itself
    // (tabindex="0" + aria-label in the markup above).
    viewportEl.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        loadQuestion(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        loadQuestion(currentIndex + 1);
      }
    });

    nextBtn.onclick = () => {
      let nextIdx = currentIndex + 1;
      if (nextIdx >= currentLearnings.length) nextIdx = 0;
      loadQuestion(nextIdx);
    };

    // Initial shuffle of allLearnings so they don't always appear in the same order on fresh load
    for (let i = allLearnings.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allLearnings[i], allLearnings[j]] = [allLearnings[j], allLearnings[i]];
    }
    currentLearnings = [...allLearnings];

    loadQuestion(0);
  });
</script>

<style>
  .learning-board {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: linear-gradient(145deg, var(--surface-raised), var(--surface-page));
    /* Optical padding: the bottom edge sits right below a row of bordered buttons (trivia
       options, or the "Read Article"/"Next Question" reveal row) — same fix as the YouTube
       video/info Box in youtube_feed.html, +12px over the p-4/p-md-5 base on each side. */
    padding-bottom: 36px !important;
  }
  @media (min-width: 768px) {
    .learning-board {
      padding-bottom: 44px !important;
    }
  }
  .learning-board:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.12) !important;
  }
  .trivia-btn {
    transition: all 0.2s ease;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--surface-raised);
  }
  .trivia-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background-color: var(--accent-bg);
    color: var(--accent);
  }
  .trivia-correct {
    background-color: var(--btn-primary) !important;
    border-color: var(--btn-primary) !important;
    color: #ffffff !important;
  }
  .trivia-wrong {
    background-color: var(--danger) !important;
    border-color: var(--danger) !important;
    color: #ffffff !important;
  }
  
  .trivia-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--border);
    transition: background-color 0.2s ease, transform 0.2s ease;
  }
  .trivia-dot.active {
    background-color: var(--fg);
    transform: scale(1.4);
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .shake-anim {
    animation: shake 0.3s ease-in-out;
  }
  
  .btn-blue {
    background-color: var(--accent-solid) !important;
    color: #ffffff !important;
    border-color: rgba(27, 31, 36, 0.15) !important;
  }
  .btn-blue:hover {
    background-color: var(--accent-solid-hover) !important;
  }
</style>
{% endif %}
