name: AI YouTube Curator

on:
  workflow_call:
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Node Dependencies
        working-directory: .github/scripts
        # npm ci, not npm install - the latter can rewrite package-lock.json on drift (integrity
        # hashes, resolved URLs), and that file is tracked but never staged by this workflow's own
        # "Commit and push changes" step below, which left it as a genuine unstaged change and
        # made `git pull --rebase` fail with "cannot pull with rebase: You have unstaged changes."
        # npm ci never mutates the lockfile, so this removes the problem at the source instead of
        # adding package-lock.json to the git add list.
        run: npm ci

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'github-actions-bot@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Fetch Curated YouTube Videos via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: node .github/scripts/fetch_youtube.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/youtube.json
          git add _data/youtube_eval_log.json || true
          # -A (not just `git add`) so deletions are staged too — fetch_youtube.js's syncThumbnails()
          # removes local thumbnails for any video that's fallen out of the curated feed, and a plain
          # `git add` on a path only stages additions/modifications, not files deleted from disk.
          # Left unstaged, that deletion is exactly what made `git pull --rebase` below fail with
          # "cannot pull with rebase: You have unstaged changes" — same bug class unsplash.yml's own
          # commit step already had to fix for fetch_unsplash.js's identical download-missing/
          # remove-stale sync shape.
          git add -A -- assets/youtube-thumbnails

          if git diff-index --quiet HEAD; then
            echo "No new YouTube content generated."
          else
            git commit -m "chore: Update AI YouTube Feed [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
