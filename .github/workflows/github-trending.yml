name: Fetch GitHub Trending

on:
  schedule:
    - cron: '0 22 * * 0' # Weekly, fires Sunday 22:00 UTC = Monday 06:00 GMT+8 - was Monday 02:00
      # UTC (Monday 10:00 GMT+8). Matches fetch_github.js's own since=weekly window; daily trending
      # was confirmed too volatile to be a useful signal (see docs/adr and the trending-repos
      # design thread).
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch GitHub trending repos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _data
          node .github/scripts/fetch_github.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/trending.json

          if git diff-index --quiet HEAD; then
            echo "No new trending data generated."
          else
            git commit -m "chore: Update GitHub Trending feed [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
