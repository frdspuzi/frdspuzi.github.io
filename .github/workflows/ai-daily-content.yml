name: Daily AI Content Generation

on:
  schedule:
    - cron: '0 22 * * *' # Daily, 06:00 GMT+8 - was 00:30 UTC (08:30 GMT+8)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  youtube:
    name: Run YouTube Curator
    uses: ./.github/workflows/ai-youtube.yml
    secrets: inherit

  # Gratitude and learning trivia are generated by Claude cloud routines instead (22:00 and 22:30
  # UTC daily), not Gemini. Their jobs were removed from here because they ran after the routines
  # and overwrote them nightly. ai-gratitude.yml and ai-learning.yml stay as manual-only fallbacks
  # (workflow_dispatch).
