name: Fetch Product Hunt Trending

on:
  schedule:
    - cron: '10 22 * * *' # Daily, 06:10 GMT+8 - was 03:00 UTC (11:00 GMT+8). Not weekly like
      # github-trending.yml's cron: a Product Hunt product launches once and never reappears, so a
      # weekly cadence structurally discards real content instead of just smoothing noise
      # (confirmed via a real week of live data, 2026-08-22 - see fetch_producthunt.js's own
      # comment on todayWindow for the numbers). Set 10 minutes after ai-daily-content.yml's own
      # 06:00 GMT+8 anchor (not the same instant) since both call the Gemini API - this script is
      # the 4th concurrent caller alongside that workflow's youtube/gratitude/learning sub-jobs.
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch Product Hunt trending posts
        env:
          PRODUCTHUNT_API_TOKEN: ${{ secrets.PRODUCTHUNT_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _data
          node .github/scripts/fetch_producthunt.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/producthunt.json

          if git diff-index --quiet HEAD; then
            echo "No new Product Hunt data generated."
          else
            git commit -m "chore: Update Product Hunt Trending feed [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
