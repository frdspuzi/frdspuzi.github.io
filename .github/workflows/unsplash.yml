name: Fetch Unsplash Photos

on:
  schedule:
    - cron: '0 22 * * *' # Daily, 06:00 GMT+8 - was twice a day (00:00 and 12:00 UTC); collapsed to
      # once a day per an explicit scope call when the other daily content workflows were moved to
      # a shared 06:00 GMT+8 morning anchor.
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch photos from Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          mkdir -p _data
          # Created here too (not just inside fetch_unsplash.js's syncLocalImages()) so the
          # `git add -A -- assets/photography` step below always has a real path to operate on,
          # even on a run where the change-detection short-circuit skips syncLocalImages entirely.
          mkdir -p assets/photography

          echo "Running fetch_unsplash.js..."
          node .github/scripts/fetch_unsplash.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/unsplash_all.json _data/unsplash_favourites.json _data/unsplash_meta.json
          # -A (not just `git add`) so deletions are staged too — fetch_unsplash.js removes local
          # copies of any photo no longer on the profile/Favourites, and a plain `git add` on a
          # path only stages additions/modifications, not files that were deleted from disk.
          git add -A -- assets/photography
          if [ -f _data/unsplash.json ]; then
            git rm _data/unsplash.json || true
          fi
          if [ -f _data/unsplash_latest.json ]; then
            git rm _data/unsplash_latest.json || true
          fi
          if [ -f _data/unsplash_popular.json ]; then
            git rm _data/unsplash_popular.json || true
          fi

          if git diff-index --quiet HEAD; then
            echo "No new photos."
          else
            git commit -m "chore: Update Unsplash photos data (All Photos, Favourites) [skip ci]"
            # Every other daily-content workflow already rebases before pushing - this one didn't,
            # which was safe only because it ran well clear of the others' schedules. Now that all
            # of them converge on the same 06:00 GMT+8 morning window, a concurrent push from
            # another workflow landing first would otherwise reject this one outright with no retry.
            git pull --rebase -X theirs
            git push
          fi
