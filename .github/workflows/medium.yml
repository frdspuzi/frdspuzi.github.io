name: Fetch Medium Articles

on:
  schedule:
    - cron: '0 1 * * *' # Once a day — articles don't publish often enough to need more
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-medium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Medium articles
        run: |
          mkdir -p _data
          node .github/scripts/fetch_medium.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/medium.json

          if git diff-index --quiet HEAD; then
            echo "No new Medium articles."
          else
            git commit -m "chore: Update Medium articles [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
