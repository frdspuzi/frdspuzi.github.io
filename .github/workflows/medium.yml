name: Fetch Medium Articles

on:
  schedule:
    - cron: '0 22 * * *' # Daily, 06:00 GMT+8 - was 01:00 UTC (09:00 GMT+8). Articles don't publish
      # often enough to need more than once a day; no Gemini calls here, so no rate-limit reason to
      # keep it apart from the other workflows now sharing this same morning anchor.
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-medium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch Medium articles
        run: |
          mkdir -p _data
          node .github/scripts/fetch_medium.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/medium.json
          # -A so new thumbnails are committed and removed ones are staged as deletions too -
          # fetch_medium.js writes assets/medium-images/ but, unlike the YouTube/Unsplash
          # workflows, this one never staged it, so new articles shipped without a thumbnail.
          git add -A -- assets/medium-images

          if git diff-index --quiet HEAD; then
            echo "No new Medium articles."
          else
            git commit -m "chore: Update Medium articles [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
