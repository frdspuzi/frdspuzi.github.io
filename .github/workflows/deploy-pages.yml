name: Deploy component-lab to GitHub Pages

# push: for direct/manual pushes to master (this workflow's own commits, anything pushed by
# hand). NOT sufficient by itself for the AI-content workflows below, even though they also push
# to master: every one of them commits with "[skip ci]" (see each workflow's own commit step) —
# a GitHub-recognized directive that suppresses *all* workflow runs triggered by that push,
# including this one, regardless of how the workflow that made the commit was itself triggered
# (cron or manual workflow_dispatch both still produce a "[skip ci]" commit). Confirmed the hard
# way: manually running Fetch Medium/Unsplash still didn't redeploy component-lab, and the site
# fell back to serving the classic Jekyll build in the meantime.
#
# workflow_run is the fix — it triggers on another workflow's *completion*, a separate event from
# the push itself, so it isn't subject to that same "[skip ci]" push-event suppression. Every
# workflow that writes to _data/*.json (which component-lab imports directly at build time, not
# at runtime) is listed here, so any content refresh — scheduled or manual — keeps the deployed
# build in sync without needing a second, unskipped commit.
on:
  push:
    branches: [master]
  workflow_run:
    workflows:
      - "Daily AI Content Generation"
      - "AI Gratitude Generator"
      - "AI Learning Trivia"
      - "AI YouTube Curator"
      - "Fetch Medium Articles"
      - "Fetch Unsplash Photos"
      - "Fetch GitHub Trending"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather than queuing behind
# it, since only the latest commit's build is ever worth actually serving.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only proceed for a workflow_run if the triggering workflow actually succeeded — it still
    # fires on failure/cancellation, and there's nothing new to deploy if the content fetch
    # itself didn't complete (no commit means no push means _data/*.json didn't change).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      commit_sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: resolve-sha
        # Same commit workflow_run vs push logic the checkout step below needs — factored into
        # one place so the "Verify live deployment" step in the deploy job can't drift from what
        # was actually built.
        run: echo "sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the commit that triggered it by default (it resolves
          # to this workflow file's own ref instead) — head_sha is the actual commit the content
          # workflow just pushed, which is what needs building.
          ref: ${{ steps.resolve-sha.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: component-lab/package-lock.json

      - name: Install dependencies
        working-directory: component-lab
        run: npm ci

      - name: Lint
        working-directory: component-lab
        run: npm run lint

      - name: Build
        working-directory: component-lab
        run: npm run build
        env:
          # Baked into index.html's <meta name="build-commit"> via Vite's HTML env replacement —
          # see that tag's own comment for why (the "Verify live deployment" step below).
          VITE_COMMIT_SHA: ${{ steps.resolve-sha.outputs.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: component-lab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        # actions/deploy-pages reporting success doesn't guarantee GitHub Pages' CDN actually
        # serves the new build - confirmed for real once (2026-08-19: a successful deploy of a
        # commit with a fresh _data/youtube.json still served an ~90-minute-stale bundle,
        # silently, with nothing in Actions showing anything wrong). Polling for this build's own
        # commit SHA (baked into index.html's <meta name="build-commit"> - see that tag's
        # comment) turns that into a loud, visible failure instead of a stale site nobody notices
        # until someone happens to check by hand.
        run: |
          SHA="${{ needs.build.outputs.commit_sha }}"
          URL="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL" | grep -q "$SHA"; then
              echo "Live site confirmed serving commit $SHA."
              exit 0
            fi
            echo "Attempt $i/6: live site not yet showing $SHA, retrying in 15s..."
            sleep 15
          done
          echo "::error::Live site still not serving commit $SHA after deploy reported success - GitHub Pages CDN is likely stuck on a stale build. Re-run this workflow (or trigger it via workflow_dispatch) to retry."
          exit 1
